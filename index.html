<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Gênesis Brasil - CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/grupo-genesis-icone-g.svg">
<style>
  :root {
    --cor-primaria: #E8590C;
    --cor-primaria-hover: #D14E0A;
    --cor-fundo: #F5F6F8;
    --cor-sidebar: #1A1D23;
    --cor-sidebar-hover: #2A2E37;
    --cor-texto-claro: #FFFFFF;
    --cor-texto-secundario: #9CA3AF;
    --largura-sidebar: 240px;
    --largura-sidebar-colapsada: 72px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--cor-fundo);
    display: flex;
    min-height: 100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: var(--largura-sidebar);
    background: var(--cor-sidebar);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    transition: width 0.3s ease;
    z-index: 100;
  }

  .sidebar.colapsada {
    width: var(--largura-sidebar-colapsada);
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    min-height: 72px;
  }

  .logo-completa, .logo-icone {
    height: 32px;
    object-fit: contain;
  }

  .logo-completa { display: block; }
  .logo-icone { display: none; }

  .sidebar.colapsada .logo-completa { display: none; }
  .sidebar.colapsada .logo-icone { display: block; margin: 0 auto; }

  .btn-toggle {
    background: transparent;
    border: none;
    color: var(--cor-texto-secundario);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .btn-toggle:hover {
    background: var(--cor-sidebar-hover);
    color: var(--cor-texto-claro);
  }

  .sidebar.colapsada .btn-toggle { display: none; }

  .btn-toggle svg { width: 20px; height: 20px; }

  /* Botão Novo */
  .btn-novo {
    margin: 16px;
    background: var(--cor-primaria);
    color: var(--cor-texto-claro);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s;
  }

  .btn-novo:hover { background: var(--cor-primaria-hover); }
  .btn-novo svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar.colapsada .btn-novo span { display: none; }

  /* Navegação */
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 8px;
    color: var(--cor-texto-secundario);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
    overflow: hidden;
  }

  .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }

  .nav-item:hover {
    background: var(--cor-sidebar-hover);
    color: var(--cor-texto-claro);
  }

  .nav-item.ativo {
    background: rgba(232, 89, 12, 0.15);
    color: var(--cor-primaria);
  }

  .sidebar.colapsada .nav-item span { display: none; }
  .sidebar.colapsada .nav-item { justify-content: center; }

  /* Rodapé usuário */
  .sidebar-footer {
    padding: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar-usuario {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--cor-primaria);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
    flex-shrink: 0;
  }

  .info-usuario {
    overflow: hidden;
  }

  .info-usuario .nome {
    color: var(--cor-texto-claro);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info-usuario .cargo {
    color: var(--cor-texto-secundario);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar.colapsada .info-usuario { display: none; }

  /* ===== BOTÃO MOBILE ===== */
  .btn-mobile-menu {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 200;
    background: var(--cor-sidebar);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
  }

  .overlay-mobile {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 90;
  }

  .overlay-mobile.ativo { display: block; }

  /* ===== CONTEÚDO PRINCIPAL ===== */
  .conteudo-principal {
    flex: 1;
    margin-left: var(--largura-sidebar);
    transition: margin-left 0.3s ease;
    padding: 32px;
  }

  .sidebar.colapsada ~ .conteudo-principal {
    margin-left: var(--largura-sidebar-colapsada);
  }

  .conteudo-principal h1 {
    color: #1A1D23;
    margin-bottom: 8px;
  }

  .conteudo-principal p {
    color: #6B7280;
  }

  /* ===== RESPONSIVO MOBILE ===== */
  @media (max-width: 768px) {
    .btn-mobile-menu { display: block; }

    .sidebar {
      left: -240px;
      width: 240px !important;
    }

    .sidebar.mobile-ativa {
      left: 0;
    }

    .sidebar.colapsada .logo-completa { display: block; }
    .sidebar.colapsada .logo-icone { display: none; }
    .sidebar.colapsada .nav-item span { display: inline; }
    .sidebar.colapsada .nav-item { justify-content: flex-start; }
    .sidebar.colapsada .btn-novo span { display: inline; }
    .sidebar.colapsada .info-usuario { display: block; }

    .conteudo-principal {
      margin-left: 0 !important;
      padding: 80px 20px 20px;
    }
  }
</style>
</head>
<body>

<button class="btn-mobile-menu" id="btnMobileMenu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="3" y1="6" x2="21" y2="6"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>

<div class="overlay-mobile" id="overlayMobile"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="grupo-genesis-logo-completa.svg" alt="Grupo Gênesis Brasil" class="logo-completa">
  <img src="grupo-genesis-icone-g.svg" alt="G" class="logo-icone">
    <button class="btn-toggle" id="btnToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
  </div>

  <button class="btn-novo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <span>Novo</span>
  </button>

  <nav class="sidebar-nav">
    <a href="#" class="nav-item ativo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="9"/>
        <rect x="14" y="3" width="7" height="5"/>
        <rect x="14" y="12" width="7" height="9"/>
        <rect x="3" y="16" width="7" height="5"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Contatos</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      <span>Negociações</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Agenda</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>Relatórios</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="avatar-usuario">DG</div>
    <div class="info-usuario">
      <div class="nome">Diogo</div>
      <div class="cargo">Administrador</div>
    </div>
  </div>
</aside>

<main class="conteudo-principal">
  <h1>Bem-vindo ao CRM Gênesis Brasil</h1>
  <p>Selecione uma opção no menu lateral para começar.</p>
</main>

<script>
  const sidebar = document.getElementById('sidebar');
  const btnToggle = document.getElementById('btnToggle');
  const btnMobileMenu = document.getElementById('btnMobileMenu');
  const overlayMobile = document.getElementById('overlayMobile');

  // Restaura estado salvo (desktop)
  if (localStorage.getItem('sidebarColapsada') === 'true') {
    sidebar.classList.add('colapsada');
  }

  btnToggle.addEventListener('click', () => {
    sidebar.classList.toggle('colapsada');
    localStorage.setItem('sidebarColapsada', sidebar.classList.contains('colapsada'));
  });

  btnMobileMenu.addEventListener('click', () => {
    sidebar.classList.add('mobile-ativa');
    overlayMobile.classList.add('ativo');
  });

  overlayMobile.addEventListener('click', () => {
    sidebar.classList.remove('mobile-ativa');
    overlayMobile.classList.remove('ativo');
  });
</script>

</body>
</html>
